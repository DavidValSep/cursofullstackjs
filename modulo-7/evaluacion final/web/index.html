<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Países y PIB</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <div class="container">
    <h1>🌍 Gestión de Países y PIB</h1>
    
    <div id="notification-box" class="notification hidden"></div>

    <div class="grid">
      <div class="card">
        <h2>➕ Agregar País</h2>
        <form id="form-add">
          <div class="form-group">
            <label for="add-nombre">Nombre del País:</label>
            <input type="text" id="add-nombre" required placeholder="Ej. Canadá">
          </div>
          <div class="form-group">
            <label for="add-continente">Continente:</label>
            <input type="text" id="add-continente" required placeholder="Ej. America">
          </div>
          <div class="form-group">
            <label for="add-poblacion">Población:</label>
            <input type="number" id="add-poblacion" required placeholder="Ej. 38000000">
          </div>
          <div class="form-group">
            <label for="add-pib2019">PIB 2019:</label>
            <input type="number" id="add-pib2019" required placeholder="Ej. 46190">
          </div>
          <div class="form-group">
            <label for="add-pib2020">PIB 2020:</label>
            <input type="number" id="add-pib2020" required placeholder="Ej. 43240">
          </div>
          <button type="submit" class="btn btn-success">Guardar País</button>
        </form>
      </div>

      <div class="card">
        <h2>🗑️ Eliminar País</h2>
        <form id="form-delete">
          <div class="form-group">
            <label for="delete-nombre">Nombre del País a Eliminar:</label>
            <input type="text" id="delete-nombre" required placeholder="Ej. Holanda">
          </div>
          <button type="submit" class="btn btn-danger">Eliminar del Sistema</button>
        </form>
      </div>
    </div>

    <div class="card table-card">
      <div class="table-header">
        <h2>📋 Registros del Sistema</h2>
        <div class="controls">
          <label for="records-limit">Mostrar:</label>
          <select id="records-limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table id="paises-table">
          <thead>
            <tr>
              <th>País</th>
              <th>Continente</th>
              <th>Población</th>
              <th>PIB 2019</th>
              <th>PIB 2020</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>

      <div class="table-footer">
        <span id="page-indicator">Página 1</span>
        <button id="btn-next" class="btn">Siguiente ➡️</button>
      </div>
    </div>
  </div>

</body>
</html>
